<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AI Resume Analyzer</title>

    <!-- GOOGLE FONT -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- FONT AWESOME -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            background:
            linear-gradient(
                rgba(5,10,25,0.95),
                rgba(5,10,25,0.95)
            ),
            url("https://images.unsplash.com/photo-1521791136064-7986c2920216?q=80&w=2070&auto=format&fit=crop");

            background-size:cover;
            background-position:center;

            min-height:100vh;

            color:white;
        }

        /* =========================
           NAVBAR
        ========================== */

        .navbar{

            width:100%;

            padding:20px 60px;

            display:flex;

            justify-content:space-between;

            align-items:center;

            background:rgba(255,255,255,0.04);

            backdrop-filter:blur(10px);

            border-bottom:1px solid rgba(255,255,255,0.08);
        }

        .logo{

            font-size:32px;

            font-weight:700;

            background:linear-gradient(
                to right,
                #60a5fa,
                #c084fc
            );

            -webkit-background-clip:text;

            -webkit-text-fill-color:transparent;
        }

        .nav-links a{

            color:white;

            text-decoration:none;

            margin-left:30px;

            font-size:16px;

            transition:0.3s;
        }

        .nav-links a:hover{

            color:#a855f7;
        }

        /* =========================
           HERO
        ========================== */

        .hero{

            text-align:center;

            margin-top:40px;
        }

        .hero h1{

            font-size:50px;

            font-weight:700;
        }

        .hero span{

            background:linear-gradient(
                to right,
                #60a5fa,
                #c084fc
            );

            -webkit-background-clip:text;

            -webkit-text-fill-color:transparent;
        }

        .hero p{

            margin-top:12px;

            color:#d1d5db;

            font-size:17px;
        }

        /* =========================
           MAIN CONTAINER
        ========================== */

        .container{

            width:70%;

            max-width:850px;

            margin:35px auto;

            background:rgba(255,255,255,0.06);

            backdrop-filter:blur(16px);

            border:1px solid rgba(255,255,255,0.08);

            border-radius:25px;

            padding:35px;
        }

        .section-title{

            font-size:45px;

            margin-bottom:10px;
        }

        .section-subtitle{

            color:#cbd5e1;

            margin-bottom:30px;
        }

        /* =========================
           UPLOAD BOX
        ========================== */

        .upload-box{

            border:2px dashed rgba(255,255,255,0.18);

            border-radius:20px;

            padding:35px;

            text-align:center;

            background:rgba(255,255,255,0.03);

            transition:0.3s;
        }

        .upload-box:hover{

            border-color:#8b5cf6;

            background:rgba(139,92,246,0.05);
        }

        .upload-box i{

            font-size:50px;

            margin-bottom:15px;

            color:#8b5cf6;
        }

        .upload-box h2{

            margin-bottom:12px;

            font-size:35px;
        }

        .upload-box p{

            color:#cbd5e1;

            margin-bottom:20px;
        }

        input[type="file"]{

            display:none;
        }

        .upload-btn{

            display:inline-block;

            padding:14px 32px;

            border-radius:12px;

            background:linear-gradient(
                to right,
                #2563eb,
                #9333ea
            );

            cursor:pointer;

            font-size:16px;

            font-weight:600;

            transition:0.3s;
        }

        .upload-btn:hover{

            transform:translateY(-3px);
        }

        /* =========================
           SUCCESS MESSAGE
        ========================== */

        #uploadMessage{

            margin-top:18px;

            color:#4ade80;

            font-size:15px;

            font-weight:500;
        }

        /* =========================
           ANALYZE BUTTON
        ========================== */

        .analyze-btn{

            width:100%;

            margin-top:25px;

            padding:16px;

            border:none;

            border-radius:14px;

            background:linear-gradient(
                to right,
                #2563eb,
                #9333ea
            );

            color:white;

            font-size:18px;

            font-weight:600;

            cursor:pointer;

            transition:0.3s;
        }

        .analyze-btn:hover{

            transform:scale(1.01);
        }

        /* =========================
           RESULTS
        ========================== */

        #results{

            margin-top:40px;
        }

        .skills-box{

            background:rgba(255,255,255,0.05);

            padding:22px;

            border-radius:18px;

            margin-bottom:30px;
        }

        .skills-box h2{

            margin-bottom:18px;
        }

        .skill{

            display:inline-block;

            padding:10px 18px;

            margin:8px;

            border-radius:30px;

            background:linear-gradient(
                to right,
                #2563eb,
                #9333ea
            );

            font-size:14px;
        }

        /* =========================
           JOB CARD
        ========================== */

        .job-card{

            background:rgba(255,255,255,0.05);

            border:1px solid rgba(255,255,255,0.08);

            padding:25px;

            border-radius:20px;

            margin-bottom:22px;

            transition:0.3s;
        }

        .job-card:hover{

            transform:translateY(-5px);

            border-color:#8b5cf6;
        }

        .job-header{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:18px;
        }

        .job-role{

            font-size:25px;

            font-weight:600;
        }

        .match{

            background:linear-gradient(
                to right,
                #2563eb,
                #9333ea
            );

            padding:10px 18px;

            border-radius:30px;

            font-size:14px;

            font-weight:600;
        }

        .job-details{

            color:#d1d5db;

            line-height:2;
        }

        .apply-btn{

            margin-top:20px;

            padding:12px 26px;

            border:none;

            border-radius:12px;

            background:white;

            color:#111827;

            font-weight:600;

            cursor:pointer;

            transition:0.3s;
        }

        .apply-btn:hover{

            background:#9333ea;

            color:white;
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media(max-width:768px){

            .container{

                width:92%;

                padding:25px;
            }

            .hero h1{

                font-size:38px;
            }

            .section-title{

                font-size:35px;
            }

            .navbar{

                padding:20px;
            }

            .upload-box h2{

                font-size:28px;
            }
        }

    </style>

</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <div class="navbar">

        <div class="logo">

            AI Resume Analyzer

        </div>

        <div class="nav-links">

            <a href="/index">

                Home

            </a>

            <a href="/logout">

                Logout

            </a>

        </div>

    </div>

    <!-- =========================
         HERO SECTION
    ========================== -->

    <div class="hero">

        <h1>

            Upload Your <span>Resume</span>

        </h1>

        <p>

            AI analyzes your skills and recommends the best matching jobs

        </p>

    </div>

    <!-- =========================
         MAIN CONTAINER
    ========================== -->

    <div class="container">

        <h1 class="section-title">

            Resume Analyzer

        </h1>

        <p class="section-subtitle">

            Upload your resume PDF and let AI find jobs based on your skills.

        </p>

        <!-- =========================
             UPLOAD BOX
        ========================== -->

        <div class="upload-box">

            <i class="fa-solid fa-file-arrow-up"></i>

            <h2>

                Upload Resume

            </h2>

            <p>

                Supported format: PDF

            </p>

            <label
                for="resumeFile"
                class="upload-btn">

                Choose Resume

            </label>

            <input
                type="file"
                id="resumeFile"
                accept=".pdf">

            <!-- SUCCESS MESSAGE -->

            <div id="uploadMessage"></div>

        </div>

        <!-- =========================
             ANALYZE BUTTON
        ========================== -->

        <button
            class="analyze-btn"
            onclick="analyzeResume()">

            Check Job Match

        </button>

        <!-- =========================
             RESULTS
        ========================== -->

        <div id="results"></div>

    </div>

    <!-- =========================
         JAVASCRIPT
    ========================== -->

<script>

async function analyzeResume(){

    const fileInput =
        document.getElementById('resumeFile');

    const file =
        fileInput.files[0];

    // FILE CHECK

    if(!file){

        alert("Please upload resume");

        return;
    }

    // SUCCESS MESSAGE

    document.getElementById(
        'uploadMessage'
    ).innerHTML =
    "✅ Resume uploaded successfully";

    // FORM DATA

    const formData = new FormData();

    formData.append('resume', file);

    // API CALL

    const response = await fetch(

        '/analyze-resume',

        {
            method:'POST',
            body:formData
        }
    );

    const data = await response.json();

    // =========================
    // SKILLS
    // =========================

    let skillsHTML = "";

    data.skills.forEach(skill => {

        skillsHTML += `

            <span class="skill">

                ${skill}

            </span>
        `;
    });

    // =========================
    // JOBS
    // =========================

    let jobsHTML = "";

    data.jobs.forEach(job => {

        jobsHTML += `

        <div class="job-card">

            <div class="job-header">

                <div class="job-role">

                    ${job.role}

                </div>

                <div class="match">

                    ${job.match}% Match

                </div>

            </div>

            <div class="job-details">

                <p>

                    <b>Company:</b>

                    ${job.company}

                </p>

                <p>

                    <b>Required Skills:</b>

                    ${job.skills}

                </p>

            </div>

            <button class="apply-btn">

                Apply Now

            </button>

        </div>
        `;
    });

    // =========================
    // DISPLAY RESULTS
    // =========================

    document.getElementById(
        'results'
    ).innerHTML = `

        <div class="skills-box">

            <h2>

                Extracted Skills

            </h2>

            ${skillsHTML}

        </div>

        <h2 style="margin-bottom:25px;">

            Recommended Jobs

        </h2>

        ${jobsHTML}
    `;
}

</script>

</body>

</html>
